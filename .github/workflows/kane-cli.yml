name: Kane CLI browser smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kane-smoke:
    # GitHub does not provide repository secrets to forked pull requests.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies and build the planner
        run: |
          npm ci
          npm run build

      - name: Start the planner
        run: |
          npm run dev -- --host 0.0.0.0 > "$RUNNER_TEMP/vite.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/vite.pid"
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:5173/ > /dev/null; then
              echo "Planner is ready at http://localhost:5173"
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/vite.log"
          echo "Planner did not start within 60 seconds."
          exit 1

      - name: Restore the Kane CLI smoke recording
        uses: actions/cache@v4
        with:
          path: .testmuai/tests/output-planner-smoke
          key: kane-planner-smoke-${{ runner.os }}-${{ hashFiles('.testmuai/tests/planner-smoke_test.md') }}

      - name: Run the Kane CLI browser smoke test
        uses: LambdaTest/kane-cli/integrations/github-action/kane-cli-browser-run@main
        with:
          test-files: .testmuai/tests/planner-smoke_test.md
          parallel: "1"
          fail-fast: "true"
          comment-on-pr: "false"
          kane-version: 0.10.0-rc.3
          username: ${{ secrets.LT_USERNAME }}
          access-key: ${{ secrets.LT_ACCESS_KEY }}
